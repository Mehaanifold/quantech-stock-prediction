name: CI/CD Pipeline - Stock Prediction App

# Triggers: Runs automatically on push to main or pull requests targeting main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Global environment variables
env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================================
  # STAGE 1: CI (Continuous Integration) - Build, Lint & Test
  # ==========================================================
  ci-build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Python Syntax & Bytecode Compilation Check
        run: |
          echo "Executing compilation check across all source modules..."
          python -m py_compile app.py stock_data.py prediction.py tests/test_app.py
          echo "All Python source files compiled with valid syntax."

      - name: 5. Run Automated Unit & Integration Tests (pytest)
        run: |
          echo "Running pytest test suite with verbose reporting..."
          python -m pytest -v --durations=10

      - name: 6. Dry-Run Docker Container Packaging
        run: |
          echo "Validating Dockerfile buildability..."
          docker build -t test-package:ci-dry-run .
          echo "Container image built successfully in CI environment."

  # ==========================================================
  # STAGE 2: CD (Continuous Delivery) - Package & Publish to GHCR
  # ==========================================================
  cd-package-and-publish:
    name: Package & Publish Container to GHCR
    needs: ci-build-and-test
    # Only publish images when merging or pushing to main (PRs do not publish)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Convert Image Name to Lowercase
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 4. Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: 6. Build and Push Container Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # STAGE 3: Continuous Deployment (Cloud Service Trigger)
  # ==========================================================
  cd-deploy-trigger:
    name: Deploy to Cloud Platform
    needs: cd-package-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Live Deployment Webhook (Optional External Host)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Deployment webhook secret detected. Triggering automated deployment..."
            curl -s -X POST "$DEPLOY_HOOK"
            echo "Deployment webhook triggered successfully."
          else
            echo "No external deploy webhook secret (RENDER_DEPLOY_HOOK) configured."
            echo "Application is configured for continuous auto-deploy via Streamlit Community Cloud."
            echo "Streamlit Community Cloud automatically listens to changes on branch 'main'."
          fi
